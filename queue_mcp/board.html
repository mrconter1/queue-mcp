<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue</title>
<style>
/* A local tool, read at a glance from across the desk: one column, generous
   type, and colour used only where it means something - what is running now,
   and what failed. */
:root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --raised: #f0f2f6;
    --border: #e2e5ea;
    --border-strong: #c9ced6;
    --text: #1c2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef3ff;
    --good: #067647;
    --bad: #b42318;
    --radius: 8px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #14171c;
        --surface: #1b1f26;
        --raised: #232832;
        --border: #2a2f38;
        --border-strong: #3a414c;
        --text: #e8eaed;
        --muted: #9aa3b0;
        --accent: #6f9bff;
        --accent-soft: #1d2739;
        --good: #4ade80;
        --bad: #f87171;
    }
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px 20px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
}

main { max-width: 900px; margin: 0 auto; }

header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: -0.01em;
}

.spacer { flex: 1 1 auto; }

select, input[type="text"], textarea {
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
}

header.top select { max-width: 340px; font-size: 0.82rem; }

button {
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
}

button:hover { background: var(--raised); }

button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
}

button.primary:hover { filter: brightness(1.06); }

/* Adding: one line, at the head of the list it adds to. */
form.add { display: flex; gap: 8px; margin-bottom: 10px; }

form.add input[type="text"] { flex: 1 1 auto; }

.counts {
    display: flex;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--muted);
}

.count strong { color: var(--text); font-weight: 600; }

h2 {
    margin: 26px 0 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
}

h2 .n { font-weight: 500; letter-spacing: 0; text-transform: none; }

/* What is being worked on right now: the one thing on the page that is
   allowed to shout. */
.now {
    border: 1px solid var(--accent);
    border-left-width: 4px;
    border-radius: var(--radius);
    background: var(--accent-soft);
    padding: 14px 16px;
}

.now .text { font-size: 1.02rem; font-weight: 550; }

.now .meta { margin-top: 6px; font-size: 0.8rem; color: var(--muted); }

.idle {
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--muted);
    font-size: 0.9rem;
}

ol.items { list-style: none; margin: 0; padding: 0; }

li.item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-bottom: 0;
    background: var(--surface);
}

li.item:first-child { border-radius: var(--radius) var(--radius) 0 0; }

li.item:last-child { border-bottom: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }

li.item:only-child { border-radius: var(--radius); }

li.item.dragging { opacity: 0.4; }

/* Where the dragged row would land. */
li.item.over { box-shadow: inset 0 2px 0 0 var(--accent); }

li.item.over-below { box-shadow: inset 0 -2px 0 0 var(--accent); }

.grip {
    color: var(--border-strong);
    cursor: grab;
    user-select: none;
    font-size: 0.9rem;
    line-height: 1;
}

li.item:hover .grip { color: var(--muted); }

.pos {
    min-width: 1.6em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
    text-align: right;
}

.id {
    color: var(--muted);
    font-size: 0.74rem;
    font-variant-numeric: tabular-nums;
}

.text { flex: 1 1 auto; overflow-wrap: anywhere; }

.badge {
    padding: 1px 6px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.68rem;
    white-space: nowrap;
}

li.item .text[data-edit] { cursor: text; }

/* Row controls: present but quiet, and only once the row is under the pointer,
   so twenty rows do not read as forty buttons. */
.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 90ms ease; }

li.item:hover .row-actions,
li.item:focus-within .row-actions { opacity: 1; }

.row-actions button { padding: 2px 7px; font-size: 0.78rem; line-height: 1.4; }

.row-actions button.drop:hover { border-color: var(--bad); color: var(--bad); }

/* Editing happens in the row, so the queue keeps its shape while it is done. */
.editor { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; }

.editor textarea { width: 100%; min-height: 62px; resize: vertical; }

.editor .buttons { display: flex; gap: 6px; align-items: center; }

.editor .hint { color: var(--muted); font-size: 0.75rem; }

#error {
    display: none;
    margin: 12px 0 0;
    padding: 8px 12px;
    border: 1px solid var(--bad);
    border-radius: 6px;
    color: var(--bad);
    font-size: 0.85rem;
}

#error.shown { display: block; }

.done .text { color: var(--muted); }

.mark { font-weight: 700; font-size: 0.8rem; }

.mark.ok { color: var(--good); }

.mark.bad { color: var(--bad); }

.result {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
}

details.finished summary {
    cursor: pointer;
    margin: 26px 0 10px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
}

details.finished summary .n { font-weight: 500; letter-spacing: 0; text-transform: none; }

footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.76rem;
}

.stale { color: var(--bad); }
</style>
</head>
<body>
<main>
    <header class="top">
        <h1>Queue</h1>
        <select id="session" aria-label="Which queue"></select>
        <span class="spacer"></span>
        <span class="counts" id="counts"></span>
    </header>

    <p id="error" role="alert"></p>

    <section>
        <h2>Now</h2>
        <div id="now"></div>
    </section>

    <section>
        <h2>Next <span class="n" id="next-count"></span></h2>
        <form class="add" id="add">
            <input type="text" id="add-text" placeholder="Add a task to the end of the queue" autocomplete="off">
            <select id="add-mode" aria-label="How it runs">
                <option value="inline">inline</option>
                <option value="fork">fork</option>
            </select>
            <button type="submit" class="primary">Add</button>
        </form>
        <div id="next"></div>
    </section>

    <details class="finished" id="finished-wrap">
        <summary>Finished <span class="n" id="finished-count"></span></summary>
        <div id="finished"></div>
    </details>

    <footer id="footer"></footer>
</main>

<script>
"use strict";

/**
 * The board polls the server and redraws. State lives on the server - the
 * same files the MCP tools read - so the page holds nothing of its own except
 * which queue is in view and when it last heard back.
 */
/** Only the fallback rate: the stream is what keeps the page current. */
const POLL_MS = 2000;
const el = (id) => document.getElementById(id);

// Which queue is in view: the URL wins, so a tab can be left on one queue;
// otherwise the last one picked here, because this machine runs several Claude
// sessions at once and the newest queue with work is not always the wanted one.
const REMEMBERED = "queue-board-session";
const remembered = () => {
    try { return localStorage.getItem(REMEMBERED) || ""; } catch { return ""; }
};
const remember = (id) => {
    try { localStorage.setItem(REMEMBERED, id); } catch { /* private window: the URL still works */ }
};

let chosen = new URLSearchParams(location.search).get("session") || remembered();
/** When the server was last heard from at all, and when the queue last moved.
    They are different questions: a quiet queue still beats. */
let lastSeen = 0;
let lastChange = 0;
let lastUpdated = "";
let running = null;
let pending = [];
/** The item open in an editor, and the row being dragged: while either is set
    the list is left alone, so a poll cannot pull the ground from under it. */
let editing = null;
let dragging = null;

const escape = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]
));

/** A count of seconds as a person would say it. */
const since = (stamp) => {
    if (!stamp) { return ""; }
    const seconds = Math.max(0, Math.round((Date.now() - new Date(stamp).getTime()) / 1000));
    if (seconds < 60) { return `${seconds}s`; }
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) { return `${minutes}m ${seconds % 60}s`; }
    const hours = Math.floor(minutes / 60);
    return `${hours}h ${minutes % 60}m`;
};

const showError = (message) => {
    const box = el("error");
    box.textContent = message;
    box.classList.toggle("shown", Boolean(message));
};

/**
 * Every change goes through here: post it, then draw what came back. The whole
 * state is the answer to a write, so the page never renders what it assumed
 * would happen - the session being watched may have claimed an item in the
 * same moment.
 */
const change = async (path, body) => {
    try {
        const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session: chosen, ...body })
        });
        const payload = await response.json();
        if (!response.ok) {
            showError(payload.error || response.statusText);
            await poll();
            return false;
        }
        showError("");
        took(payload);
        return true;
    } catch {
        showError("Cannot reach the queue server.");
        return false;
    }
};

const shortSession = (id) => (id && id.length > 12 ? `${id.slice(0, 8)}...${id.slice(-4)}` : id || "");

/** One line in the picker: what is in that queue, and how long ago it moved. */
const sessionLabel = (session) => {
    const parts = [];
    if (session.in_progress) { parts.push("running"); }
    if (session.pending) { parts.push(`${session.pending} pending`); }
    if (!parts.length) { parts.push(`${session.total} done`); }
    return `${shortSession(session.session_id)} - ${parts.join(", ")} - ${since(session.updated)} ago`;
};

const drawSessions = (sessions, current) => {
    const picker = el("session");
    // Rebuilding the options on every poll would close the dropdown under the
    // pointer, so it is only redrawn when the set of queues actually changes.
    const signature = sessions.map((s) => `${s.session_id}:${s.pending}:${s.in_progress}`).join("|") + `#${current}`;
    if (picker.dataset.signature === signature) { return; }
    picker.dataset.signature = signature;
    if (!sessions.length) {
        picker.innerHTML = '<option value="">no queues yet</option>';
        return;
    }
    // This machine accumulates a queue per Claude session, and almost all of
    // them are finished history. The ones with work come first, under their
    // own heading, so the live one is never hunted for.
    const group = (title, list) => (list.length ? `<optgroup label="${escape(title)}">` + list.map((s) => `
        <option value="${escape(s.session_id)}"${s.session_id === current ? " selected" : ""}>${escape(sessionLabel(s))}</option>`
    ).join("") + "</optgroup>" : "");
    const live = sessions.filter((s) => s.pending || s.in_progress);
    const rest = sessions.filter((s) => !s.pending && !s.in_progress);
    picker.innerHTML = group("With work", live) + group("Finished", rest);
};

const drawNow = (item) => {
    running = item;
    if (!item) {
        el("now").innerHTML = '<div class="idle">Nothing running. The next item starts when the session claims it.</div>';
        return;
    }
    el("now").innerHTML = `
        <div class="now">
            <div class="text">${escape(item.text)}</div>
            <div class="meta"><span class="id">#${item.id}</span> &middot; running <span id="elapsed">${since(item.started)}</span>${item.mode === "fork" ? " &middot; fork" : ""}</div>
        </div>`;
};

const rowHtml = (item, index) => `
    <li class="item" draggable="true" data-id="${item.id}">
        <span class="grip" aria-hidden="true">&#8942;&#8942;</span>
        <span class="pos">${index + 1}</span>
        <span class="id">#${item.id}</span>
        <span class="text" data-edit="${item.id}" title="Click to edit">${escape(item.text)}</span>
        ${item.mode === "fork" ? '<span class="badge">fork</span>' : ""}
        <span class="row-actions">
            <button type="button" data-edit="${item.id}" title="Edit this task">Edit</button>
            <button type="button" class="drop" data-remove="${item.id}" title="Remove from the queue">&times;</button>
        </span>
    </li>`;

const editorHtml = (item, index) => `
    <li class="item" data-id="${item.id}">
        <span class="pos">${index + 1}</span>
        <span class="id">#${item.id}</span>
        <span class="editor">
            <textarea id="edit-text">${escape(item.text)}</textarea>
            <span class="buttons">
                <button type="button" class="primary" data-save="${item.id}">Save</button>
                <button type="button" data-cancel="1">Cancel</button>
                <span class="hint">Enter saves, Shift+Enter for a new line, Esc cancels</span>
            </span>
        </span>
    </li>`;

const drawNext = (items) => {
    pending = items;
    el("next-count").textContent = items.length ? `(${items.length})` : "";
    if (!items.length) {
        el("next").innerHTML = '<div class="idle">Queue empty.</div>';
        return;
    }
    el("next").innerHTML = "<ol class='items'>"
        + items.map((item, i) => (item.id === editing ? editorHtml(item, i) : rowHtml(item, i))).join("")
        + "</ol>";
    if (editing !== null) {
        const box = el("edit-text");
        if (box) {
            box.focus();
            box.setSelectionRange(box.value.length, box.value.length);
        }
    }
};

const drawFinished = (items) => {
    // Newest first: what just happened is what a reader is looking for.
    const recent = items.slice().reverse();
    el("finished-count").textContent = recent.length ? `(${recent.length})` : "";
    el("finished").innerHTML = recent.length ? "<ol class='items'>" + recent.map((item) => `
        <li class="item done">
            <span class="mark ${item.status === "failed" ? "bad" : "ok"}">${item.status === "failed" ? "!" : "x"}</span>
            <span class="id">#${item.id}</span>
            <span class="text">${escape(item.text)}
                ${item.result ? `<div class="result">${escape(item.result)}</div>` : ""}
            </span>
        </li>`).join("") + "</ol>" : '<div class="idle">Nothing finished in this queue yet.</div>';
};

const drawCounts = (counts) => {
    const part = (label, value) => `<span class="count"><strong>${value || 0}</strong> ${label}</span>`;
    el("counts").innerHTML = [
        part("pending", counts.pending),
        part("done", counts.done),
        counts.failed ? part("failed", counts.failed) : ""
    ].filter(Boolean).join(" &middot; ");
};

const render = (state) => {
    chosen = state.session_id || "";
    drawSessions(state.sessions || [], chosen);
    drawCounts(state.counts || {});
    const items = state.items || [];
    drawNow(items.find((i) => i.status === "in_progress") || null);
    drawFinished(items.filter((i) => i.status === "done" || i.status === "failed"));
    // The rest of the page keeps up while a row is being typed into or dragged;
    // that row does not, or the text under the cursor would be replaced by the
    // server's copy of it mid-word. The list catches up when the edit ends.
    if (editing === null && dragging === null) {
        drawNext(items.filter((i) => i.status === "pending"));
    } else {
        pending = items.filter((i) => i.status === "pending");
    }
};

/** A gap longer than two heartbeats means nothing is answering, not that
    nothing is happening. */
const DEAD_MS = 35000;

const drawFooter = () => {
    const foot = el("footer");
    if (!lastSeen || Date.now() - lastSeen > DEAD_MS) {
        foot.innerHTML = '<span class="stale">Not hearing from the queue server. Is it still running?</span>';
        return;
    }
    foot.textContent = lastChange
        ? `Updated ${since(new Date(lastChange).toISOString())} ago`
        : "Waiting for the queue";
};

/** One place to record that a state payload arrived, however it arrived. */
const took = (state) => {
    lastSeen = Date.now();
    if (state.updated !== lastUpdated) {
        lastUpdated = state.updated || "";
        lastChange = lastSeen;
    }
    render(state);
    drawFooter();
};

/**
 * The queue, pushed as it changes. EventSource reconnects by itself, which is
 * also what carries the page across a restart of the server: it goes quiet for
 * a moment and then carries on, because the queue lives in files and not in
 * the process.
 */
let stream = null;
let streamOk = false;

const listen = () => {
    if (!window.EventSource) { return; }
    if (stream) { stream.close(); }
    stream = new EventSource(`/api/events${chosen ? `?session=${encodeURIComponent(chosen)}` : ""}`);
    stream.onmessage = (event) => {
        streamOk = true;
        took(JSON.parse(event.data));
    };
    // The queue can be quiet for a long time; a beat says the line is open.
    stream.addEventListener("beat", () => {
        streamOk = true;
        lastSeen = Date.now();
        drawFooter();
    });
    stream.onerror = () => {
        // The browser is already reconnecting; say so rather than doing
        // anything about it, and let the slow poll cover the gap.
        streamOk = false;
        drawFooter();
    };
};

const poll = async () => {
    // A poll in the middle of a drag would rebuild the row under the pointer.
    if (dragging !== null) { return; }
    try {
        const response = await fetch(`/api/state${chosen ? `?session=${encodeURIComponent(chosen)}` : ""}`);
        if (!response.ok) { throw new Error(response.statusText); }
        took(await response.json());
    } catch {
        drawFooter();
    }
};

// --- changing the queue -------------------------------------------------------

el("add").addEventListener("submit", async (event) => {
    event.preventDefault();
    const box = el("add-text");
    const text = box.value.trim();
    if (!text) { return; }
    if (await change("/api/add", { text, mode: el("add-mode").value })) {
        box.value = "";
    }
    box.focus();
});

const saveEdit = async () => {
    const box = el("edit-text");
    if (!box || editing === null) { return; }
    const id = editing;
    const text = box.value.trim();
    editing = null;
    // Emptying the box is not a way to delete a task; that is what the x is for.
    if (text) { await change("/api/edit", { id, text }); } else { await poll(); }
};

const cancelEdit = async () => {
    editing = null;
    await poll();
};

el("next").addEventListener("click", async (event) => {
    const target = event.target.closest("[data-edit], [data-remove], [data-save], [data-cancel]");
    if (!target) { return; }
    if (target.dataset.remove) {
        await change("/api/remove", { id: Number(target.dataset.remove) });
    } else if (target.dataset.save) {
        await saveEdit();
    } else if (target.dataset.cancel) {
        await cancelEdit();
    } else if (target.dataset.edit) {
        editing = Number(target.dataset.edit);
        drawNext(pending);
    }
});

el("next").addEventListener("keydown", async (event) => {
    if (editing === null) { return; }
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        await saveEdit();
    } else if (event.key === "Escape") {
        event.preventDefault();
        await cancelEdit();
    }
});

// --- dragging to reorder ------------------------------------------------------

const rowAt = (event) => event.target.closest("li.item[data-id]");

/** Which row the pointer is over, and which half of it. */
const dropAt = (event) => {
    const row = rowAt(event);
    if (!row) { return null; }
    const box = row.getBoundingClientRect();
    return { id: Number(row.dataset.id), below: event.clientY > box.top + box.height / 2 };
};

const clearMarks = () => {
    el("next").querySelectorAll("li.item").forEach((row) => row.classList.remove("over", "over-below"));
};

el("next").addEventListener("dragstart", (event) => {
    const row = rowAt(event);
    if (!row || editing !== null) { return; }
    dragging = Number(row.dataset.id);
    row.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
    // Firefox starts a drag only when something has been set on it.
    event.dataTransfer.setData("text/plain", row.dataset.id);
});

el("next").addEventListener("dragover", (event) => {
    if (dragging === null) { return; }
    event.preventDefault();
    const row = rowAt(event);
    if (!row) { return; }
    clearMarks();
    const box = row.getBoundingClientRect();
    row.classList.add(event.clientY > box.top + box.height / 2 ? "over-below" : "over");
});

el("next").addEventListener("drop", async (event) => {
    if (dragging === null) { return; }
    event.preventDefault();
    const target = dropAt(event);
    const held = dragging;
    dragging = null;
    clearMarks();
    if (target === null || target.id === held) { await poll(); return; }
    // The order the server is given is the whole pending order, so it either
    // takes the list the user is looking at or refuses it as stale.
    const ids = pending.map((item) => item.id).filter((id) => id !== held);
    const at = ids.indexOf(target.id) + (target.below ? 1 : 0);
    ids.splice(at < 0 ? ids.length : at, 0, held);
    await change("/api/reorder", { ids });
});

el("next").addEventListener("dragend", async () => {
    if (dragging === null) { return; }
    dragging = null;
    clearMarks();
    await poll();
});

el("session").addEventListener("change", (event) => {
    chosen = event.target.value;
    remember(chosen);
    editing = null;
    // The queue in view belongs in the URL, so a tab can be left on one.
    const url = new URL(location.href);
    url.searchParams.set("session", chosen);
    history.replaceState(null, "", url);
    listen();
    void poll();
});

// The elapsed time ticks between polls, so the page never looks frozen.
setInterval(() => {
    const clock = el("elapsed");
    if (clock && running) { clock.textContent = since(running.started); }
    drawFooter();
}, 1000);

void poll();
listen();
// The stream does the work; this is the net under it, for a browser without
// EventSource and for the seconds after a server restart when the page has not
// been reconnected yet.
setInterval(() => {
    if (!streamOk) { void poll(); }
}, POLL_MS);
</script>
